name: CI

# All of Solco's automation runs here, on free public runners; the
# private source repository has no workflows. Every 30 minutes this looks at
# the private repository: it tests the newest untested commit on master, and
# starts the release build for a new version tag (publishing still waits for
# the maintainer's approval). A maintainer can also test any commit by hand.
#
# This repository is public, so nothing here may reveal the source:
# - only the schedule, a dispatch and a maintainer's manual run start it (no
#   pull_request triggers, so no fork can run a workflow here);
# - diagnostics use the short format, which names file and line without
#   quoting code, and rustfmt reports only the names of unformatted files;
# - compiled outputs are cached with mbx, which only this repository's own
#   workflows can restore; nothing is uploaded as an artifact.
run-name: CI ${{ inputs.source_sha || github.event.client_payload.source_sha || 'check for new commits' }}

on:
  schedule:
    - cron: '7 * * * *'
  repository_dispatch:
    types: [ci]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full commit hash in the private source repository
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'poll' || 'test' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  SOURCE_SHA: ${{ inputs.source_sha || github.event.client_payload.source_sha }}
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '0'

jobs:
  # On the schedule: find the private master's commit and, unless a run has
  # already tested it, start one for it.
  poll:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Find the private master commit
        uses: actions/checkout@v7
        with:
          repository: crmne/solco
          ref: master
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          # Kept for this job only, to list tags; nothing here runs the source.
          persist-credentials: true
          sparse-checkout: rust-toolchain.toml
          sparse-checkout-cone-mode: false
      - name: Test it unless a run already has
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          tested="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --limit 100 \
            --json displayTitle -q "[.[] | select(.displayTitle == \"CI $sha\")] | length")"
          if [ "$tested" = 0 ]; then
            # A scheduled dispatch must not supersede a manual/native run that
            # is still testing the preceding source revision. Try next poll.
            active="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --limit 100 \
              --json event,status -q '[.[] | select(.event != "schedule" and .status != "completed")] | length')"
            if [ "$active" = 0 ]; then
              gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" -f source_sha="$sha"
              echo "Started a test run for $sha" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "CI is already active; defer $sha until the next poll" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "$sha is already tested" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build the newest version tag unless a release run exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(git ls-remote --tags origin 'refs/tags/v*' | python3 -c '
          import re, sys
          def key(tag):
              match = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)(?:-(alpha|beta)\.(\d+))?", tag)
              if not match:
                  return None
              major, minor, patch, stage, number = match.groups()
              # alpha < beta < the final release.
              rank = {"alpha": 0, "beta": 1, None: 2}[stage]
              return (int(major), int(minor), int(patch), rank, int(number or 0))
          tags = {line.split("refs/tags/")[1].strip().removesuffix("^{}") for line in sys.stdin if "refs/tags/" in line}
          ranked = sorted((key(tag), tag) for tag in tags if key(tag))
          print(ranked[-1][1] if ranked else "")
          ')"
          [ -n "$tag" ] || exit 0
          version="${tag#v}"
          started="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --limit 100 \
            --json displayTitle -q "[.[] | select(.displayTitle == \"Release $version\")] | length")"
          if [ "$started" = 0 ] && ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh workflow run release.yml --repo "$GITHUB_REPOSITORY" -f version="$version" -f source_ref="$tag"
            echo "Started the release build for $tag" >> "$GITHUB_STEP_SUMMARY"
          fi

  test:
    if: github.event_name != 'schedule'
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The first build of each platform is cold.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 120 || 90 }}
    strategy:
      # Keep each platform's failure details: cancelling a sibling while its
      # tests run loses Rust's final assertion report and forces another build.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: The request names one full commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Expected a full commit hash"; exit 1; }

      - name: Check out private source
        uses: actions/checkout@v7
        with:
          repository: crmne/solco
          ref: ${{ env.SOURCE_SHA }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      - name: GUI and audio build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpipewire-0.3-dev libpulse-dev \
            libssl-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libgl1-mesa-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Select native Windows Perl for OpenSSL
        if: runner.os == 'Windows'
        shell: bash
        run: |
          perl=C:/Strawberry/perl/bin/perl.exe
          test -f "$perl"
          echo "OPENSSL_SRC_PERL=$perl" >> "$GITHUB_ENV"

      # macOS's default temporary folder is under /var, a symlink to
      # /private/var, and the preparation cache refuses symlinked paths.
      - name: Temporary files on a real path
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$(cd "$RUNNER_TEMP/tmp" && pwd -P)" >> "$GITHUB_ENV"

      # The toolchain rust-toolchain.toml pins, with rustfmt and clippy,
      # before the cache so its key follows the pinned rustc.
      - name: Rust toolchain
        shell: bash
        run: rustup toolchain install

      # One cache generation per platform.
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: test-${{ matrix.os }}-v1

      - name: Formatting
        if: runner.os == 'Linux'
        shell: bash
        run: cargo fmt --check -- -l

      - name: Lints
        shell: bash
        run: mbx clippy --locked --all-targets --message-format short

      - name: Tests
        shell: bash
        run: mbx test --locked --all-targets --no-fail-fast --message-format short

      # A real export, update and verification on FAT32 and exFAT volumes
      # the system mounts, which DJs carry (Solco's ADR 0358). Throwaway
      # volumes on this runner only; the test does nothing without them.
      # Every volume gets a folder export. Where the system counts a volume
      # as a removable drive (macOS disk images; Windows VHDs on some
      # runners), Solco also exports to the drive itself: FAT32 now, exFAT
      # once Solco accepts exFAT drives, with no change here (the test notes
      # a drive it skips).
      - name: Throwaway FAT32 and exFAT volumes (Linux)
        id: linux-volumes
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q dosfstools exfatprogs
          dir="$RUNNER_TEMP/volumes"
          mkdir -p "$dir"
          roots=()
          for fs in vfat exfat; do
            image="$dir/$fs.img"
            truncate -s 256M "$image"
            if [ "$fs" = vfat ]; then mkfs.vfat -F 32 -n E2EFAT "$image"; else mkfs.exfat -L E2EEXFAT "$image"; fi
            mkdir -p "$dir/$fs"
            sudo mount -t "$fs" -o "loop,uid=$(id -u),gid=$(id -g)" "$image" "$dir/$fs"
            roots+=("$dir/$fs")
          done
          echo "volumes=${roots[0]}:${roots[1]}" >> "$GITHUB_OUTPUT"

      - name: Throwaway FAT32 and exFAT volumes (macOS)
        id: macos-volumes
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/volumes"
          mkdir -p "$dir"
          hdiutil create -quiet -size 256m -fs "MS-DOS FAT32" -layout MBRSPUD -volname E2EFAT "$dir/fat32.dmg"
          hdiutil create -quiet -size 256m -fs ExFAT -layout MBRSPUD -volname E2EEXFAT "$dir/exfat.dmg"
          hdiutil attach -quiet "$dir/fat32.dmg"
          hdiutil attach -quiet "$dir/exfat.dmg"
          mount | grep -E 'E2EFAT|E2EEXFAT'
          echo "volumes=/Volumes/E2EFAT:/Volumes/E2EEXFAT" >> "$GITHUB_OUTPUT"

      - name: Throwaway FAT32 and exFAT volumes (Windows)
        id: windows-volumes
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'volumes'
          New-Item -ItemType Directory -Force $dir | Out-Null
          foreach ($volume in @(@{ fs = 'fat32'; label = 'E2EFAT'; letter = 'R' }, @{ fs = 'exfat'; label = 'E2EEXFAT'; letter = 'S' })) {
            $image = Join-Path $dir "$($volume.label).vhdx"
            $script = Join-Path $dir "$($volume.label).txt"
            @(
              "create vdisk file=`"$image`" maximum=300 type=expandable",
              "select vdisk file=`"$image`"",
              'attach vdisk',
              'convert mbr',
              'create partition primary',
              "format fs=$($volume.fs) quick label=$($volume.label)",
              "assign letter=$($volume.letter)"
            ) | Set-Content -Encoding ascii $script
            diskpart /s $script
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          Get-Volume -DriveLetter R, S | Format-Table -AutoSize
          "volumes=R:\;S:\" >> $env:GITHUB_OUTPUT

      - name: Export, update and verify on FAT32 and exFAT
        if: ${{ !cancelled() }}
        shell: bash
        env:
          SOLCO_EXPORT_VOLUMES: ${{ steps.linux-volumes.outputs.volumes || steps.macos-volumes.outputs.volumes || steps.windows-volumes.outputs.volumes }}
        run: |
          set -euo pipefail
          [ -n "$SOLCO_EXPORT_VOLUMES" ] || { echo "No volumes were created"; exit 1; }
          mbx test --locked --test pioneer_export --message-format short -- real_volumes --nocapture

  release-policy:
    name: release retention fixtures
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - run: |
          gem install minitest --version 6.0.6 --no-document
          ruby scripts/test_release_retention.rb
          ruby scripts/test_linux_repositories.rb
          ruby scripts/test_release_artifact_retention.rb
          ruby scripts/test_release_workflow.rb
          ruby scripts/test_ci_poll.rb
          ruby scripts/test_preserve_macos_runtime.rb
          ruby scripts/test_macos_dmg_workflow.rb

  recipes:
    name: packaging recipes
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: The request names one full commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Expected a full commit hash"; exit 1; }
      - name: Check out private source
        uses: actions/checkout@v7
        with:
          repository: crmne/solco
          ref: ${{ env.SOURCE_SHA }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - run: |
          gem install minitest --version 6.0.6 --no-document
          gem install minitest-mock --version 5.27.0 --no-document
          ruby scripts/test_native_package.rb
          if [ -f scripts/test_windows_model_migration.rb ]; then ruby scripts/test_windows_model_migration.rb; fi
          ruby scripts/test_models.rb
          # The committed platform icons (ADR 0176), where the source has them.
          if [ -f scripts/test_brand_icons.rb ]; then ruby scripts/test_brand_icons.rb; fi
