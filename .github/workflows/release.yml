name: Build release
run-name: Release ${{ inputs.version || github.event.client_payload.version }}

on:
  # CI's 30-minute check starts this for a new version tag in the private
  # source repository; it can also be started by hand, for example to
  # rebuild a tag whose build failed.
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v
        required: true
        type: string
      source_ref:
        description: Tag or commit in the private source repository
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version || github.event.client_payload.version }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Public logs: backtraces and diagnostics must not quote the private source.
  RUST_BACKTRACE: '0'
  VERSION: ${{ inputs.version || github.event.client_payload.version }}
  SOURCE_REF: ${{ inputs.source_ref || github.event.client_payload.source_ref }}
  RELEASE_TAG: v${{ inputs.version || github.event.client_payload.version }}

jobs:
  prepare:
    name: Validate tagged release inputs
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.inputs.outputs.source_sha }}
      private_alpha: ${{ steps.inputs.outputs.private_alpha }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: crmne/solco
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - name: Bind version, tag and alpha configuration
        id: inputs
        shell: bash
        run: |
          ruby <<'RUBY'
          require 'open3'
          version = ENV.fetch('VERSION')
          abort 'Unsupported release version' unless version.match?(/\A(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-alpha\.[1-9][0-9]*)?\z/)
          package = File.read('Cargo.toml').split(/^\[package\]\s*$/).fetch(1).split(/^\[/).first
          abort 'Crate and requested versions differ' unless package.match(/^version\s*=\s*"([^"]+)"/)[1] == version
          tag, status = Open3.capture2('git', 'rev-parse', '--verify', "refs/tags/v#{version}^{commit}")
          abort 'The requested release tag does not exist' unless status.success?
          head, status = Open3.capture2('git', 'rev-parse', '--verify', 'HEAD')
          abort 'Source checkout differs from the release tag' unless status.success? && head == tag && head.strip.match?(/\A[a-f0-9]{40}\z/)
          alpha = version.include?('-')
          if alpha
            require_relative 'scripts/lib/alpha_release'
            require_relative 'scripts/lib/alpha_release_notes'
            release = Solco::AlphaRelease.load(Dir.pwd, version: version)
            Solco::AlphaReleaseNotes.read(Dir.pwd)
            tags, status = Open3.capture2('git', 'tag', '--merged', 'HEAD', '--list', 'v*-alpha.*')
            abort 'Unable to inspect earlier alpha versions' unless status.success?
            tags.lines.map(&:strip).reject { |name| name == "v#{version}" }.each do |name|
              previous, status = Open3.capture2('git', 'show', "#{name}:release/private-alpha.json")
              abort "Missing earlier alpha configuration: #{name}" unless status.success?
              previous = JSON.parse(previous, allow_duplicate_key: false)
              previous = Solco::AlphaRelease.new(previous, version: name.delete_prefix('v'))
              abort 'Native build counter must increase after earlier alpha tags' unless release.data.fetch('build_number') > previous.data.fetch('build_number')
            end
            puts release.summary
          else
            notes = "packaging/release-notes/v#{version}.md"
            abort 'Missing committed stable release notes' unless File.file?(notes) && !File.read(notes).strip.empty?
          end
          File.open(ENV.fetch('GITHUB_OUTPUT'), 'a') do |output|
            output.puts("source_sha=#{head.strip}")
            output.puts("private_alpha=#{alpha}")
          end
          RUBY

  build:
    name: build (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package_target: linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            package_target: linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            package_target: windows-amd64
    steps:
      - name: Check out private source
        uses: actions/checkout@v7
        with:
          repository: crmne/solco
          ref: ${{ needs.prepare.outputs.source_sha }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: rustup target add ${{ matrix.target }}
      - name: GUI and audio build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpipewire-0.3-dev libpulse-dev \
            libssl-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libgl1-mesa-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Load fixed alpha metadata and complete models
        if: needs.prepare.outputs.private_alpha == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ruby scripts/alpha_release.rb env --version "$VERSION"
          ruby scripts/models.rb check-native-pins

      - name: Require the private model revision
        if: needs.prepare.outputs.private_alpha == 'true'
        shell: bash
        run: test -n "$SOLCO_MODEL_SOURCE_REVISION"

      - name: Check out the pinned private model bundle
        if: needs.prepare.outputs.private_alpha == 'true'
        uses: actions/checkout@v7
        with:
          repository: crmne/solco
          ref: ${{ env.SOLCO_MODEL_SOURCE_REVISION }}
          path: .release-models
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Verify and stage every model
        if: needs.prepare.outputs.private_alpha == 'true'
        shell: bash
        run: ruby scripts/model_archive.rb stage-private "$VERSION" .release-models "$RUNNER_TEMP/alpha-models"

      - name: Select native Windows Perl for OpenSSL
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ruby <<'RUBY'
          require 'open3'
          candidates = ['C:/Strawberry/perl/bin/perl.exe'] +
            ENV.fetch('PATH').split(File::PATH_SEPARATOR).map { |dir| File.join(dir, 'perl.exe') }
          perl = candidates.uniq.find do |path|
            next false unless File.file?(path)
            platform, _, status = Open3.capture3(path, '-e', 'print $^O')
            status.success? && platform == 'MSWin32'
          end
          abort 'A native Windows Perl installation is required to build OpenSSL' unless perl
          File.open(ENV.fetch('GITHUB_ENV'), 'a') { |file| file.puts("OPENSSL_SRC_PERL=#{perl}") }
          puts "Verified native Windows Perl: #{perl}"
          RUBY

      - name: Build private alpha
        if: needs.prepare.outputs.private_alpha == 'true'
        shell: bash
        env:
          SOLCO_OFFICIAL_RELEASE: '1'
          TARGET: ${{ matrix.target }}
        run: |
          # Ruby's Windows setup exports GNU MAKE; OpenSSL's MSVC build needs NMAKE.
          if [[ "$RUNNER_OS" == Windows ]]; then
            unset MAKE MAKEFLAGS MFLAGS
          fi
          ruby scripts/alpha_release.rb build --version "$VERSION" --target "$TARGET"

      - name: Build stable
        if: needs.prepare.outputs.private_alpha != 'true'
        shell: bash
        env:
          SOLCO_OFFICIAL_RELEASE: '1'
          TARGET: ${{ matrix.target }}
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            unset MAKE MAKEFLAGS MFLAGS
          fi
          cargo build --locked --release --message-format short --target "$TARGET"

      - name: Bundle Microsoft VC++ runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Redist.14.Latest -property installationPath
          if (-not $installation) {
            throw 'Visual Studio installation with the VC++ redistributable is unavailable'
          }
          $redistRoot = Join-Path $installation 'VC\Redist\MSVC'
          $crt = Get-ChildItem $redistRoot -Directory |
            Sort-Object Name -Descending |
            ForEach-Object {
              Get-ChildItem (Join-Path $_.FullName 'x64') -Directory -Filter 'Microsoft.VC*.CRT' -ErrorAction SilentlyContinue
            } |
            Select-Object -First 1
          if (-not $crt) {
            throw "Microsoft VC++ x64 redistributable directory is unavailable under $redistRoot"
          }
          Copy-Item (Join-Path $crt.FullName '*.dll') -Destination 'target/${{ matrix.target }}/release'

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="solco-${RELEASE_TAG}-${{ matrix.target }}"
          release="target/${{ matrix.target }}/release"
          mkdir -p "dist/$name"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$release/solco.exe" "dist/$name/"
            # New source tags ship a GUI executable and its console companion.
            # Old tags retain their original single-executable packaging.
            if [ -f scripts/windows_launcher.rb ]; then
              ruby scripts/windows_launcher.rb stage "$release/solco.exe" "dist/$name/solco.com"
            fi
          else
            cp "$release/solco" "dist/$name/"
          fi
          shopt -s nullglob
          for runtime in "$release"/*.dll "$release"/*.so "$release"/*.dylib; do
            cp -L "$runtime" "dist/$name/"
          done
          cp README.md LICENSE "dist/$name/"
          # Tells the app's updater this unpacked copy may replace itself.
          # The Windows installer leaves it out and installs its own marker.
          printf 'solco-portable-v1\n' > "dist/$name/solco-portable.txt"
          if [ "${{ needs.prepare.outputs.private_alpha }}" = "true" ]; then
            ruby scripts/models.rb stage "$RUNNER_TEMP/alpha-models" "dist/$name/models"
            cp release/private-alpha.json "dist/$name/alpha-release.json"
            cp packaging/PRIVATE-ALPHA.md "dist/$name/"
            chmod 644 "dist/$name/alpha-release.json" "dist/$name/PRIVATE-ALPHA.md"
          elif [ -f src/model_bundle.rs ]; then
            # Stable packages include the same pinned Beat This model as macOS.
            # The staging command checks its size and SHA-256, then encrypts it.
            model="$RUNNER_TEMP/beat_this.onnx"
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
              --retry 3 --max-filesize 83162650 --output "$model" \
              https://github.com/danigb/beat-this-rs/releases/download/model-large/beat_this.onnx
            ruby scripts/models.rb stage-beat "$model" "dist/$name/models"
          fi
          if [ "${{ runner.os }}" = "Linux" ]; then
            cp --parents packaging/applications/solco.desktop packaging/icons/solco.svg packaging/models/Beat-This-LICENSE "dist/$name/"
            # Newer sources also ship the icon drawn for each size (ADR 0176).
            if [ -d packaging/icons/hicolor ]; then
              cp -r --parents packaging/icons/hicolor "dist/$name/"
            fi
          fi
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi

      - name: Build Windows installer
        if: runner.os == 'Windows' && needs.prepare.outputs.private_alpha != 'true'
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler is unavailable: $iscc"
          }
          $source = (Resolve-Path 'dist/solco-${{ env.RELEASE_TAG }}-${{ matrix.target }}').Path
          $output = (Resolve-Path 'dist').Path
          $script = (Resolve-Path 'packaging/windows/Solco.iss').Path
          $arguments = @("/DSourceDir=$source", "/DOutputDir=$output", "/DAppVersion=$env:VERSION", "/DReleaseTag=$env:RELEASE_TAG")
          if ($env:SOLCO_NUMERIC_VERSION) {
            $arguments += "/DNumericVersion=$env:SOLCO_NUMERIC_VERSION"
          }
          & $iscc @arguments $script
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }
          # The updater's name, or the name older tags' setup script used.
          if (-not (Test-Path 'dist/solco-${{ env.RELEASE_TAG }}-x86_64-pc-windows-msvc-setup.exe') -and
              -not (Test-Path 'dist/solco-${{ env.RELEASE_TAG }}-windows-x86_64-setup.exe')) {
            throw 'Windows installer was not produced'
          }

      - uses: actions/setup-go@v5
        if: runner.os == 'Linux' && needs.prepare.outputs.private_alpha == 'true'
        with:
          go-version: '1.26.4'
          cache: false
      - name: Install alpha Linux package tools
        if: runner.os == 'Linux' && needs.prepare.outputs.private_alpha == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools binutils
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
      - name: Build verified native alpha packages
        if: needs.prepare.outputs.private_alpha == 'true'
        shell: bash
        env:
          PACKAGE_TARGET: ${{ matrix.package_target }}
        run: |
          set -euo pipefail
          gem install native-packages --version 0.8.1 --no-document
          export SOURCE_DATE_EPOCH="$SOLCO_ALPHA_RELEASED_AT"
          native-packages --config native-packages.yaml build \
            --version "$VERSION" --target "$PACKAGE_TARGET" --output "$RUNNER_TEMP/native-packages"
      - uses: actions/upload-artifact@v7
        if: needs.prepare.outputs.private_alpha == 'true'
        with:
          name: native-packages-${{ matrix.package_target }}
          path: ${{ runner.temp }}/native-packages/
          include-hidden-files: true
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: application-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  macos:
    name: macOS arm64 app
    needs: prepare
    runs-on: macos-latest
    env:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - name: Check out private source
        uses: actions/checkout@v7
        with:
          repository: crmne/solco
          ref: ${{ needs.prepare.outputs.source_sha }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: rustup target add aarch64-apple-darwin

      - name: Set the reviewed macOS deployment target
        run: |
          set -euo pipefail
          minimum="$(ruby scripts/macos_runtime.rb minimum)"
          echo "MACOSX_DEPLOYMENT_TARGET=$minimum" >> "$GITHUB_ENV"

      - name: Load fixed alpha metadata and complete models
        if: needs.prepare.outputs.private_alpha == 'true'
        run: |
          set -euo pipefail
          ruby scripts/alpha_release.rb env --version "$VERSION"
          ruby scripts/models.rb check-native-pins

      - name: Require the private model revision
        if: needs.prepare.outputs.private_alpha == 'true'
        shell: bash
        run: test -n "$SOLCO_MODEL_SOURCE_REVISION"

      - name: Check out the pinned private model bundle
        if: needs.prepare.outputs.private_alpha == 'true'
        uses: actions/checkout@v7
        with:
          repository: crmne/solco
          ref: ${{ env.SOLCO_MODEL_SOURCE_REVISION }}
          path: .release-models
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Verify and stage every model
        if: needs.prepare.outputs.private_alpha == 'true'
        shell: bash
        run: ruby scripts/model_archive.rb stage-private "$VERSION" .release-models "$RUNNER_TEMP/alpha-models"

      - name: Build private alpha arm64
        env:
          SOLCO_OFFICIAL_RELEASE: '1'
        if: needs.prepare.outputs.private_alpha == 'true'
        run: ruby scripts/alpha_release.rb build --version "$VERSION" --target aarch64-apple-darwin

      - name: Build stable arm64
        env:
          SOLCO_OFFICIAL_RELEASE: '1'
        if: needs.prepare.outputs.private_alpha != 'true'
        run: cargo build --locked --release --message-format short --target aarch64-apple-darwin

      - name: Fetch verified analysis model
        if: needs.prepare.outputs.private_alpha != 'true'
        run: |
          model="$RUNNER_TEMP/beat_this.onnx"
          curl --fail --location --retry 3 \
            --output "$model" \
            https://github.com/danigb/beat-this-rs/releases/download/model-large/beat_this.onnx
          test "$(stat -f%z "$model")" = 83162650
          printf '%s  %s\n' \
            5f810debe53459b559127fb55bbad40035bb47cc567b20e501670f968c770f02 \
            "$model" | shasum -a 256 --check

      - name: App bundle
        run: |
          set -euo pipefail
          if [ "${{ needs.prepare.outputs.private_alpha }}" = "true" ]; then
            bash packaging/macos/bundle.sh \
              target/aarch64-apple-darwin/release/solco \
              Solco.app "$VERSION" "$RUNNER_TEMP/alpha-models" \
              "$SOLCO_MACOS_VERSION" "$SOLCO_MACOS_BUILD_VERSION"
            cp release/private-alpha.json Solco.app/Contents/Resources/alpha-release.json
            cp packaging/PRIVATE-ALPHA.md Solco.app/Contents/Resources/
            chmod 644 Solco.app/Contents/Resources/{alpha-release.json,PRIVATE-ALPHA.md}
          else
            bash packaging/macos/bundle.sh \
              target/aarch64-apple-darwin/release/solco \
              Solco.app "$VERSION" "$RUNNER_TEMP/beat_this.onnx"
          fi

      - name: Ad-hoc sign local app
        if: env.APPLE_CERTIFICATE_P12 == ''
        run: codesign --force --deep --sign - Solco.app

      - name: Verify local app bundle
        if: env.APPLE_CERTIFICATE_P12 == ''
        run: codesign --verify --deep --strict --verbose=2 Solco.app

      - name: Build verified native stable DMG
        if: needs.prepare.outputs.private_alpha != 'true'
        run: |
          set -euo pipefail
          gem install native-packages --version 0.8.1 --no-document
          native-packages --config native-packages.yaml build \
            --version "$VERSION" --target macos-arm64 --output "$RUNNER_TEMP/native-stable-macos"
          name="solco-${RELEASE_TAG}-macos-arm64"
          mkdir -p dist
          cp "$RUNNER_TEMP/native-stable-macos/packages/macos-arm64/dmg/$name.dmg" "dist/$name.dmg"

      - name: Build verified native alpha DMG
        if: needs.prepare.outputs.private_alpha == 'true'
        run: |
          set -euo pipefail
          gem install native-packages --version 0.8.1 --no-document
          export SOURCE_DATE_EPOCH="$SOLCO_ALPHA_RELEASED_AT"
          native-packages --config native-packages.yaml build \
            --version "$VERSION" --target macos-arm64 --output "$RUNNER_TEMP/native-packages"
      - uses: actions/upload-artifact@v7
        if: needs.prepare.outputs.private_alpha == 'true'
        with:
          name: native-packages-macos-arm64
          path: ${{ runner.temp }}/native-packages/
          include-hidden-files: true
          if-no-files-found: error

      - name: Sign, notarize and archive portable arm64 code
        run: |
          set -euo pipefail
          gem install native-packages --version 0.8.1 --no-document
          name="solco-${RELEASE_TAG}-macos-arm64"
          release="target/aarch64-apple-darwin/release"
          input="$RUNNER_TEMP/portable-input/$name"
          signed="$RUNNER_TEMP/portable-signed/$name"
          mkdir -p "$input" dist
          cp "$release/solco" README.md LICENSE "$input/"
          if [ "${{ needs.prepare.outputs.private_alpha }}" = "true" ]; then
            ruby scripts/models.rb stage "$RUNNER_TEMP/alpha-models" "$input/models"
            cp release/private-alpha.json "$input/alpha-release.json"
            cp packaging/PRIVATE-ALPHA.md "$input/"
            chmod 644 "$input/alpha-release.json" "$input/PRIVATE-ALPHA.md"
          else
            if [ -f src/model_bundle.rs ]; then
              ruby scripts/models.rb stage-beat "$RUNNER_TEMP/beat_this.onnx" "$input/models"
            else
              # Historical source tags still use their original model loader.
              mkdir -p "$input/models"
              cp "$RUNNER_TEMP/beat_this.onnx" "$input/models/"
              cp packaging/models/Beat-This-LICENSE "$input/models/LICENSE"
            fi
          fi
          shopt -s nullglob
          for runtime in "$release"/*.dylib; do
            cp -L "$runtime" "$input/"
          done
          ruby scripts/macos_runtime.rb verify "$input"
          native-packages notarize-macos "$input" --output "$signed"
          tar czf "dist/$name.tar.gz" -C "$RUNNER_TEMP/portable-signed" "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: application-macos-arm64
          path: |
            dist/*.dmg
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish
    needs: [prepare, build, macos]
    runs-on: ubuntu-latest
    # Publishing waits for the maintainer's approval, and only this job can
    # read the release signing key.
    environment: release-signing
    # Builds for different versions may overlap, publication and retirement may not.
    concurrency:
      group: solco-published-releases
      cancel-in-progress: false
    steps:
      - name: Check out private source for release notes
        uses: actions/checkout@v7
        with:
          repository: crmne/solco
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Check out public release policy
        uses: actions/checkout@v7
        with:
          repository: crmne/solco-releases
          ref: ${{ github.sha }}
          path: .release-policy
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - uses: actions/download-artifact@v8
        with:
          pattern: application-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        if: needs.prepare.outputs.private_alpha == 'true'
        with:
          pattern: native-packages-*
          path: ${{ runner.temp }}/native-package-inputs
      - name: Verify the complete native alpha package set
        if: needs.prepare.outputs.private_alpha == 'true'
        run: |
          set -euo pipefail
          gem install native-packages --version 0.8.1 --no-document
          ruby scripts/collect_alpha_packages.rb "$RUNNER_TEMP/native-package-inputs" \
            "$RUNNER_TEMP/native-packages-complete" dist "$VERSION"
      - uses: actions/setup-go@v5
        if: needs.prepare.outputs.private_alpha != 'true'
        with:
          go-version: '1.26.4'
          cache: false
      - name: Build stable Linux packages before signing the full download set
        if: needs.prepare.outputs.private_alpha != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libarchive-tools binutils rpm
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          gem install native-packages --version 0.8.1 --no-document
          native-packages build --version "$VERSION" --target linux-amd64 --target linux-arm64 \
            --output "$RUNNER_TEMP/stable-linux-packages"
          ruby .release-policy/scripts/collect_stable_packages.rb \
            "$RUNNER_TEMP/stable-linux-packages" dist "$VERSION"
      - name: Checksums
        run: |
          ruby <<'RUBY'
          require 'digest'
          paths = Dir.glob('dist/*').select { |path| File.file?(path) && File.basename(path) != 'checksums.txt' }.sort
          abort 'No release artifacts to hash' if paths.empty?
          # GitHub changes tildes in uploaded asset names to periods.
          names = paths.map { |path| File.basename(path).tr('~', '.') }
          abort 'Duplicate download filenames' unless names.uniq == names
          abort 'Unsupported download filename' unless names.all? { |name| name.match?(/\A[A-Za-z0-9._-]+\z/) }
          paths.zip(names).each do |path, name|
            output = File.join('dist', name)
            File.rename(path, output) unless path == output
          end
          checksums = names.sort.map { |name| "#{Digest::SHA256.file(File.join('dist', name)).hexdigest}  #{name}\n" }
          File.write('dist/checksums.txt', checksums.join)
          RUBY
      # Sign checksums.txt (checksums.txt.sig), then check the signature and
      # every listed file against the public key committed in the private
      # source, so this repository alone cannot change the key the app
      # embeds. The app's updater refuses releases without a valid signature.
      - name: Sign checksums
        env:
          SOLCO_UPDATE_SIGNING_KEY: ${{ secrets.SOLCO_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -f assets/update-public-key.hex
          test -n "$SOLCO_UPDATE_SIGNING_KEY"
          gem install native-packages --version 0.8.1 --no-document
          native-packages sign-checksums dist/checksums.txt \
            --public-key assets/update-public-key.hex \
            --key-env SOLCO_UPDATE_SIGNING_KEY
          native-packages verify-checksums dist/checksums.txt \
            --public-key assets/update-public-key.hex
      - name: Release notes
        run: |
          set -euo pipefail
          if [ "${{ needs.prepare.outputs.private_alpha }}" = "true" ]; then
            ruby scripts/alpha_release_notes.rb --version "$VERSION" > release-notes.md
            exit 0
          fi
          notes="packaging/release-notes/$RELEASE_TAG.md"
          test -s "$notes"
          cp "$notes" release-notes.md
      - name: Publish public binary release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ruby .release-policy/scripts/release_retention.rb check-publication --tag "$RELEASE_TAG"
          release_flags=()
          if [ "${{ needs.prepare.outputs.private_alpha }}" = "true" ]; then
            release_flags+=(--prerelease --latest=false)
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "${{ needs.prepare.outputs.private_alpha }}" = "true" ]; then
              gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > existing-release.json
              ruby scripts/verify_alpha_assets.rb dist existing-release.json "$RELEASE_TAG" > missing-assets.txt
              mapfile -t missing_assets < missing-assets.txt
              if [ "${#missing_assets[@]}" -gt 0 ]; then
                gh release upload "$RELEASE_TAG" "${missing_assets[@]}" --repo "$GITHUB_REPOSITORY"
              fi
            else
              gh release upload "$RELEASE_TAG" dist/* \
                --repo "$GITHUB_REPOSITORY" --clobber
            fi
            gh release edit "$RELEASE_TAG" \
              "${release_flags[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Solco ${{ env.VERSION }}" \
              --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" dist/* \
              "${release_flags[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target main \
              --title "Solco ${{ env.VERSION }}" \
              --notes-file release-notes.md
          fi
      - name: Verify published downloads and plan older release retirement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ruby .release-policy/scripts/release_retention.rb plan \
            --tag "$RELEASE_TAG" --directory "$RUNNER_TEMP/release-retention-downloads" \
            --public-key assets/update-public-key.hex \
            --manifest "$RUNNER_TEMP/release-retirement-plan.json"
      - name: Save the exact verified retirement inventory
        uses: actions/upload-artifact@v7
        with:
          name: release-retirement-${{ env.RELEASE_TAG }}
          path: ${{ runner.temp }}/release-retirement-plan.json
          if-no-files-found: error
      - name: Retire only the verified older application releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ruby .release-policy/scripts/release_retention.rb apply \
            --tag "$RELEASE_TAG" --directory "$RUNNER_TEMP/release-retention-downloads" \
            --public-key assets/update-public-key.hex \
            --manifest "$RUNNER_TEMP/release-retirement-plan.json"
