name: Check Windows MSI recipe
run-name: Check Windows MSI recipe ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Reviewed private source commit (40 lowercase hexadecimal characters)
        required: true
        type: string

permissions:
  contents: read

jobs:
  msi:
    name: Install synthetic MSI and Inno packages
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Require an exact private source commit
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'source_sha must be 40 lowercase hexadecimal characters' >&2
            exit 1
          fi
      - name: Check out the reviewed private source
        uses: actions/checkout@v7
        with:
          repository: crmne/solco
          ref: ${{ inputs.source_sha }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - name: Install WiX Toolset 5
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install, upgrade and remove packages built from synthetic payloads
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          # The packages hold copies of Windows tools, never Solco itself.
          ruby scripts/test_windows_msi.rb
