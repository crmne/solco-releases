name: Linux repositories
run-name: Linux repositories (${{ github.event_name == 'workflow_run' && github.event.workflow_run.display_title || github.event_name }})

# Keeps Solco's Linux package repositories in step with the published
# releases: the signed apt and dnf repositories in linux/, the Nix flake's
# sources in nix/release.json, and the AUR's solco-bin. It runs after every
# release build, every six hours to catch up, and by hand. Nothing here
# builds Solco: the repositories index each release's own downloads after
# checking them against its signed checksums. See docs/linux-repositories.md.

on:
  workflow_run:
    workflows: [Build release]
    types: [completed]
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rewrite and sign the repositories again even if they match the releases
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: linux-repositories
  cancel-in-progress: false

jobs:
  # Compares the releases with linux/state.json and the AUR's version,
  # without secrets, so most scheduled runs stop here.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.plan.outputs.needed }}
      beta_tag: ${{ steps.plan.outputs.beta_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: ruby scripts/linux_repositories.rb plan --output "$GITHUB_OUTPUT"

  publish:
    needs: plan
    if: needs.plan.outputs.needed == 'true' || (inputs.force && needs.plan.outputs.beta_tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The signing key and the AUR key live in this environment, which only
    # main can use.
    environment: linux-repositories
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      # Downloads are checked against the publisher key committed in the
      # private source, as the release job checks them, so this repository
      # alone cannot change which key it trusts.
      - name: Check out the publisher key from the release's source
        uses: actions/checkout@v7
        with:
          repository: crmne/solco
          ref: ${{ needs.plan.outputs.beta_tag }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          path: .release-source
          sparse-checkout: assets/update-public-key.hex
          sparse-checkout-cone-mode: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      # The same steps run in the release job, before older releases go.
      - uses: ./.github/actions/linux-repositories
        with:
          public-key: .release-source/assets/update-public-key.hex
          signing-key: ${{ secrets.LINUX_REPOSITORY_SIGNING_KEY }}
          aur-ssh-key: ${{ secrets.AUR_SSH_KEY }}
          aur-known-hosts: ${{ secrets.AUR_KNOWN_HOSTS }}
          github-token: ${{ github.token }}
          force: ${{ inputs.force && 'true' || 'false' }}
