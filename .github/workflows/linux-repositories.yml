name: Linux repositories
run-name: Linux repositories (${{ github.event_name == 'workflow_run' && github.event.workflow_run.display_title || github.event_name }})

# Keeps Solco's Linux package repositories in step with the published
# releases: the signed apt and dnf repositories in linux/, the Nix flake's
# sources in nix/release.json, and the AUR's solco-bin. It runs after every
# release build, every six hours to catch up, and by hand. Nothing here
# builds Solco: the repositories index each release's own downloads after
# checking them against its signed checksums. See docs/linux-repositories.md.

on:
  workflow_run:
    workflows: [Build release]
    types: [completed]
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rewrite and sign the repositories again even if they match the releases
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: linux-repositories
  cancel-in-progress: false

jobs:
  # Compares the releases with linux/state.json and the AUR's version,
  # without secrets, so most scheduled runs stop here.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.plan.outputs.needed }}
      beta_tag: ${{ steps.plan.outputs.beta_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: ruby scripts/linux_repositories.rb plan --output "$GITHUB_OUTPUT"

  publish:
    needs: plan
    if: needs.plan.outputs.needed == 'true' || (inputs.force && needs.plan.outputs.beta_tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The signing key and the AUR key live in this environment, which only
    # main can use.
    environment: linux-repositories
    permissions:
      contents: write
    env:
      BETA_TAG: ${{ needs.plan.outputs.beta_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      # Downloads are checked against the publisher key committed in the
      # private source, as the release job checks them, so this repository
      # alone cannot change which key it trusts.
      - name: Check out the publisher key from the release's source
        uses: actions/checkout@v7
        with:
          repository: crmne/solco
          ref: ${{ needs.plan.outputs.beta_tag }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          path: .release-source
          sparse-checkout: assets/update-public-key.hex
          sparse-checkout-cone-mode: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y createrepo-c
      - name: Import the repository signing key
        env:
          LINUX_REPOSITORY_SIGNING_KEY: ${{ secrets.LINUX_REPOSITORY_SIGNING_KEY }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$LINUX_REPOSITORY_SIGNING_KEY" | gpg --batch --quiet --import
          # The secret must be the key whose public half users install.
          fingerprint="$(gpg --show-keys --with-colons linux/solco-packages.asc | awk -F: '/^fpr/ { print $10; exit }')"
          gpg --batch --list-secret-keys "$fingerprint" > /dev/null
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "KEY_FINGERPRINT=$fingerprint" >> "$GITHUB_ENV"
      - name: Update the apt and dnf repositories and the Nix sources
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: |
          ruby scripts/linux_repositories.rb update $FORCE \
            --public-key .release-source/assets/update-public-key.hex \
            --key-fingerprint "$KEY_FINGERPRINT" --cache "$RUNNER_TEMP/downloads"
      # Through the API, so GitHub signs the commit. It stops if main moved
      # meanwhile; the next run starts again from the new main.
      - name: Publish them on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: ruby scripts/linux_repositories.rb commit --message "Update the Linux package repositories for $BETA_TAG"

      - name: Render the AUR recipe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          aur="$RUNNER_TEMP/aur"
          git clone --quiet https://aur.archlinux.org/solco-bin.git "$aur"
          ruby scripts/linux_repositories.rb pkgbuild \
            --public-key .release-source/assets/update-public-key.hex --cache "$RUNNER_TEMP/downloads" \
            --current "$aur/PKGBUILD" --output "$aur/PKGBUILD"
          # makepkg writes .SRCINFO; it runs in Arch, as an ordinary user.
          docker run --rm -v "$aur:/pkg:ro" archlinux:latest bash -c \
            'useradd -m builder && install -m 644 /pkg/PKGBUILD /home/builder/PKGBUILD && cd /home/builder &&
             su builder -c "makepkg --printsrcinfo"' > "$aur/.SRCINFO"
          grep -q '^pkgbase = solco-bin$' "$aur/.SRCINFO"
          git -C "$aur" status --short
      - name: Publish the AUR recipe
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          AUR_KNOWN_HOSTS: ${{ secrets.AUR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          aur="$RUNNER_TEMP/aur"
          if [ -z "$(git -C "$aur" status --porcelain)" ]; then
            echo 'The AUR recipe is already up to date'
            exit 0
          fi
          umask 077
          printf '%s\n' "$AUR_SSH_KEY" > "$RUNNER_TEMP/aur_key"
          printf '%s\n' "$AUR_KNOWN_HOSTS" > "$RUNNER_TEMP/aur_known_hosts"
          version="$(awk '/^pkgver=/ { sub("pkgver=", ""); v = $0 } /^pkgrel=/ { sub("pkgrel=", ""); print v "-" $0 }' "$aur/PKGBUILD")"
          git -C "$aur" add PKGBUILD .SRCINFO
          git -C "$aur" -c user.name='Carmine Paolino' -c user.email='carmine@paolino.me' \
            commit --quiet -m "Update to $version"
          GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/aur_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/aur_known_hosts" \
            git -C "$aur" push ssh://aur@aur.archlinux.org/solco-bin.git HEAD:master
          rm -f "$RUNNER_TEMP/aur_key"
