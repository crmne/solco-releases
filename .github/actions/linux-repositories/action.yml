name: Update the Linux package repositories
description: >
  Brings the signed apt and dnf repositories (linux/), the Nix flake's sources
  (nix/release.json) and the AUR's solco-bin up to date with the published
  releases. See docs/linux-repositories.md.

inputs:
  public-key:
    description: The publisher key file (hex) from the release's private source
    required: true
  signing-key:
    description: The repository's armoured OpenPGP private key
    required: true
  aur-ssh-key:
    description: The AUR account's SSH private key
    required: true
  aur-known-hosts:
    description: aur.archlinux.org's host keys
    required: true
  github-token:
    description: A token that may write this repository's contents
    required: true
  force:
    description: Write and sign the repositories again even if they match the releases
    default: 'false'

runs:
  using: composite
  steps:
    # A fresh main, so the commit below builds on what is published now.
    - uses: actions/checkout@v7
      with:
        repository: crmne/solco-releases
        ref: main
        path: .linux-repositories
        persist-credentials: false
    - name: Install repository tools and the signing key
      shell: bash
      env:
        SIGNING_KEY: ${{ inputs.signing-key }}
        PUBLIC_KEY: ${{ inputs.public-key }}
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y createrepo-c rpm
        export GNUPGHOME="$RUNNER_TEMP/linux-repositories-gnupg"
        mkdir -m 700 "$GNUPGHOME"
        printf '%s\n' "$SIGNING_KEY" | gpg --batch --quiet --import
        # The key must be the one whose public half users install.
        fingerprint="$(gpg --show-keys --with-colons .linux-repositories/linux/solco-packages.asc | awk -F: '/^fpr/ { print $10; exit }')"
        gpg --batch --list-secret-keys "$fingerprint" > /dev/null
        echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
        echo "LINUX_REPOSITORY_KEY=$fingerprint" >> "$GITHUB_ENV"
        echo "LINUX_PUBLISHER_KEY=$(realpath "$PUBLIC_KEY")" >> "$GITHUB_ENV"
    - name: Update the apt and dnf repositories and the Nix sources
      shell: bash
      working-directory: .linux-repositories
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        FORCE: ${{ inputs.force == 'true' && '--force' || '' }}
      run: |
        ruby scripts/linux_repositories.rb update $FORCE --public-key "$LINUX_PUBLISHER_KEY" \
          --key-fingerprint "$LINUX_REPOSITORY_KEY" --cache "$RUNNER_TEMP/linux-repositories-downloads"
    # Through the API, so GitHub signs the commit. It stops if main moved
    # meanwhile; the next run starts again from the new main.
    - name: Publish them on main
      shell: bash
      working-directory: .linux-repositories
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: ruby scripts/linux_repositories.rb commit --message "Update the Linux package repositories"
    - name: Render the AUR recipe
      shell: bash
      working-directory: .linux-repositories
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        aur="$RUNNER_TEMP/linux-repositories-aur"
        git clone --quiet https://aur.archlinux.org/solco-bin.git "$aur"
        ruby scripts/linux_repositories.rb pkgbuild --public-key "$LINUX_PUBLISHER_KEY" \
          --cache "$RUNNER_TEMP/linux-repositories-downloads" --current "$aur/PKGBUILD" --output "$aur/PKGBUILD"
        # makepkg writes .SRCINFO; it runs in Arch, as an ordinary user.
        docker run --rm -v "$aur:/pkg:ro" archlinux:latest bash -c \
          'useradd -m builder && install -m 644 /pkg/PKGBUILD /home/builder/PKGBUILD && cd /home/builder &&
           su builder -c "makepkg --printsrcinfo"' > "$aur/.SRCINFO"
        grep -q '^pkgbase = solco-bin$' "$aur/.SRCINFO"
        git -C "$aur" status --short
    - name: Publish the AUR recipe
      shell: bash
      env:
        AUR_SSH_KEY: ${{ inputs.aur-ssh-key }}
        AUR_KNOWN_HOSTS: ${{ inputs.aur-known-hosts }}
      run: |
        set -euo pipefail
        aur="$RUNNER_TEMP/linux-repositories-aur"
        if [ -z "$(git -C "$aur" status --porcelain)" ]; then
          echo 'The AUR recipe is already up to date'
          exit 0
        fi
        umask 077
        printf '%s\n' "$AUR_SSH_KEY" > "$RUNNER_TEMP/aur_key"
        printf '%s\n' "$AUR_KNOWN_HOSTS" > "$RUNNER_TEMP/aur_known_hosts"
        version="$(awk '/^pkgver=/ { sub("pkgver=", ""); v = $0 } /^pkgrel=/ { sub("pkgrel=", ""); print v "-" $0 }' "$aur/PKGBUILD")"
        git -C "$aur" add PKGBUILD .SRCINFO
        git -C "$aur" -c user.name='Carmine Paolino' -c user.email='carmine@paolino.me' \
          commit --quiet -m "Update to $version"
        GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/aur_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/aur_known_hosts" \
          git -C "$aur" push ssh://aur@aur.archlinux.org/solco-bin.git HEAD:master
        rm -f "$RUNNER_TEMP/aur_key"
